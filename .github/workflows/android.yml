#!/bin/bash

# ১. ফোল্ডার স্ট্রাকচার তৈরি
echo "Creating directory structure..."
mkdir -p .github/workflows
mkdir -p app/src/main/java/com/borhan/amarot/data

# ২. .github/workflows/android-ci.yml তৈরি
echo "Creating .github/workflows/android-ci.yml..."
cat << 'EOF' > .github/workflows/android-ci.yml
name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout Source Code  
        uses: actions/checkout@v4  

      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          distribution: 'temurin'  
          java-version: '17'  

      - name: Locate Project Root  
        run: |  
          if ls *.zip 1> /dev/null 2>&1; then  
            unzip -q *.zip || true  
          fi  
            
          BUILD_PATH=$(find . -name "build.gradle" -not -path "*/app/*" | head -n 1)  
          PROJECT_DIR=$(dirname "$BUILD_PATH")  
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV  
          echo "Found project at: $PROJECT_DIR"  

      - name: Grant Executable Permission for Gradlew  
        run: |  
          cd ${{ env.PROJECT_DIR }}  
          chmod +x gradlew || true  

      - name: Build Debug APK  
        run: |  
          cd ${{ env.PROJECT_DIR }}  
          if [ -f "./gradlew" ]; then  
            ./gradlew assembleDebug --stacktrace  
          else  
            gradle assembleDebug  
          fi  

      - name: Upload Debug APK Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: AmarOvertime-v1.1-debug-apk  
          path: "**/app/build/outputs/apk/debug/*.apk"
EOF

# ৩. app/build.gradle তৈরি
echo "Creating app/build.gradle..."
cat << 'EOF' > app/build.gradle
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.borhan.amarot'
    compileSdk 36

    defaultConfig {  
        applicationId 'com.borhan.amarot'  
        minSdk 23  
        targetSdk 36  
        versionCode 2  
        versionName '1.1'  

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"  
    }  

    buildTypes {  
        release {  
            minifyEnabled false  
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'  
        }  
    }  
      
    compileOptions {  
        sourceCompatibility JavaVersion.VERSION_17  
        targetCompatibility JavaVersion.VERSION_17  
    }  

    kotlinOptions {  
        jvmTarget = '17'  
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Room Database  
    def room_version = "2.6.1"  
    implementation "androidx.room:room-runtime:$room_version"  
    implementation "androidx.room:room-ktx:$room_version"  
    kapt "androidx.room:room-compiler:$room_version"  

    // Coroutines  
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
EOF

# ৪. build.gradle (Project Level) তৈরি
echo "Creating build.gradle..."
cat << 'EOF' > build.gradle
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
EOF

# ৫. DutyRepository.kt তৈরি
echo "Creating DutyRepository.kt..."
cat << 'EOF' > app/src/main/java/com/borhan/amarot/data/DutyRepository.kt
package com.borhan.amarot.data

import kotlinx.coroutines.flow.Flow

class DutyRepository(private val dutyDao: DutyDao) {

    val allDutiesForMonth = { monthYear: String -> dutyDao.getDutiesForMonth(monthYear) }  

    suspend fun insertDuty(duty: DutyRecord) {  
        dutyDao.insertDuty(duty)  
    }  

    fun getTotalMonthlyOtHours(monthYear: String): Flow<Double?> {  
        return dutyDao.getTotalMonthlyOtHours(monthYear)  
    }  

    fun getTotalMonthlyRegularHours(monthYear: String): Flow<Double?> {  
        return dutyDao.getTotalMonthlyRegularHours(monthYear)  
    }  

    fun getTotalMonthlyOtWage(monthYear: String): Flow<Double?> {  
        return dutyDao.getTotalMonthlyOtWage(monthYear)  
    }
}
EOF

# ৬. settings.gradle তৈরি
echo "Creating settings.gradle..."
cat << 'EOF' > settings.gradle
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "AmarOvertime"
include(":app")
EOF

echo "All files generated successfully!"
